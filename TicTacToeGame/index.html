<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Tic Tac Toe | Play With Friends</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<main class="game-container">

    <!-- HEADER -->
    <header class="header">

        <p class="eyebrow">THE CLASSIC GAME</p>

        <h1>Tic <span>Tac</span> Toe.</h1>

        <p class="subtitle">
            A little competition never hurt anyone.
        </p>

    </header>


    <!-- SCOREBOARD -->
    <section class="scoreboard">

        <div class="player-score active" id="playerX">

            <span class="player-symbol">X</span>

            <p>PLAYER X</p>

            <h2 id="scoreX">0</h2>

        </div>


        <div class="score-divider">VS</div>


        <div class="player-score" id="playerO">

            <span class="player-symbol">O</span>

            <p>PLAYER O</p>

            <h2 id="scoreO">0</h2>

        </div>

    </section>


    <!-- GAME STATUS -->
    <div class="game-status" id="gameStatus" aria-live="polite">
        Player X's turn
    </div>


    <!-- GAME BOARD -->
    <section class="game-board" id="gameBoard">

        <button class="cell" data-index="0" aria-label="Cell 1"></button>

        <button class="cell" data-index="1" aria-label="Cell 2"></button>

        <button class="cell" data-index="2" aria-label="Cell 3"></button>

        <button class="cell" data-index="3" aria-label="Cell 4"></button>

        <button class="cell" data-index="4" aria-label="Cell 5"></button>

        <button class="cell" data-index="5" aria-label="Cell 6"></button>

        <button class="cell" data-index="6" aria-label="Cell 7"></button>

        <button class="cell" data-index="7" aria-label="Cell 8"></button>

        <button class="cell" data-index="8" aria-label="Cell 9"></button>

    </section>


    <!-- GAME BUTTONS -->
    <div class="game-buttons">

        <button id="newGameBtn" class="new-game-btn">
            ↻ New Game
        </button>

        <button id="resetBtn" class="reset-btn">
            Reset Scores
        </button>

    </div>


    <!-- FOOTER -->
    <footer>

        <p>MADE FOR A LITTLE FRIENDLY COMPETITION ♡</p>

        <span>© 2026 TIC TAC TOE</span>

    </footer>

</main>


<script src="script.js"></script>


</body>

</html>
